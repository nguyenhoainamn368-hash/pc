name: Windows-VPS
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Cài đặt RDP
        shell: cmd
        run: |
          net user runneradmin vps12345 /add
          net localgroup administrators runneradmin /add
          reg add "HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Terminal Server" /v fDenyTSConnections /t REG_DWORD /d 0 /f
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
      - name: Khởi động Bore
        shell: powershell
        run: |
          Invoke-WebRequest https://github.com/ekzhang/bore/releases/download/v0.4.1/bore-v0.4.1-x86_64-pc-windows-msvc.zip -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath bore
          cd bore
          .\bore.exe local 3389 --to bore.pub
